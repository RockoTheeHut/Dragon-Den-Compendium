services:
  web:
    build:
      context: .
    container_name: dragon-den-compendium
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: dragon_den.settings.base
      DEBUG: "false"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      SQLITE_PATH: "/app/data/db.sqlite3"
      DJANGO_MIGRATE: "1"
      DJANGO_COLLECTSTATIC: "1"
      PORT: "8000"
    volumes:
      - app_data:/app/data
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  app_data:
  static_data:

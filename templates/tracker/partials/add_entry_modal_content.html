<div class="tracker-modal-content">
  <div class="tracker-tabs" data-tracker-tabs="1">
    <div class="tracker-tab-buttons" role="tablist" aria-label="Add entry source">
      <button type="button" class="tracker-tab-button is-active" data-tracker-tab-target="tracker-tab-quick">Quick Add</button>
      <button type="button" class="tracker-tab-button" data-tracker-tab-target="tracker-tab-compendium">From Monster/Compendium</button>
      <button type="button" class="tracker-tab-button" data-tracker-tab-target="tracker-tab-player">From Game Player</button>
    </div>

    <section id="tracker-tab-quick" class="tracker-tab-panel">
      <form method="post" action="{% url 'tracker:add_entry' %}" hx-post="{% url 'tracker:add_entry' %}" hx-target="#tracker-list-region" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful){ closeTrackerModal('tracker-add-modal'); }" class="tracker-entry-form" data-entry-type-toggle="1">
        {% csrf_token %}
        <div class="tracker-form-grid">
          <label>Name {{ manual_form.name }}</label>
          <label>Type <span data-entry-type-select-wrap="1">{{ manual_form.entry_type }}</span></label>
          <label>Initiative {{ manual_form.initiative }}</label>
          <label class="tracker-inline-check">Active {{ manual_form.is_active }}</label>
          <label data-non-player-only="1">HP Current {{ manual_form.hp_current }}</label>
          <label data-non-player-only="1">HP Max {{ manual_form.hp_max }}</label>
          <label data-non-player-only="1">Items {{ manual_form.items_text }}</label>
          <label class="tracker-form-span">Notes {{ manual_form.notes }}</label>
          <label class="tracker-form-span">
            Condition
            <select name="status_effect_condition_id">
              <option value="">Choose condition (optional)</option>
              {% for condition in condition_options %}
                <option value="{{ condition.id }}">{{ condition.name }}</option>
              {% endfor %}
            </select>
          </label>
          <label>Status Effect Name <input type="text" name="status_effect_name" placeholder="Optional override"></label>
          <label>Status Rounds <input type="number" min="1" name="status_effect_rounds" value="1"></label>
        </div>
        <div class="tracker-modal-actions">
          <button class="button" type="submit">Add Entry</button>
        </div>
      </form>
    </section>

    <section id="tracker-tab-compendium" class="tracker-tab-panel hidden">
      <form method="post" action="{% url 'tracker:add_from_compendium' %}" hx-post="{% url 'tracker:add_from_compendium' %}" hx-target="#tracker-list-region" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful){ closeTrackerModal('tracker-add-modal'); }" class="tracker-entry-form" data-compendium-hp-autofill="1">
        {% csrf_token %}
        <div class="tracker-form-grid">
          <label class="tracker-form-span">Search Monster <input type="search" class="tracker-search-input" placeholder="Type to filter monsters..." data-filter-select="{{ from_compendium_form.source.id_for_label }}"></label>
          <label class="tracker-form-span">
            Monster
            <select name="{{ from_compendium_form.source.html_name }}" id="{{ from_compendium_form.source.id_for_label }}" required>
              <option value="">---------</option>
              {% for monster in compendium_monster_options %}
                <option value="{{ monster.id }}" data-hp-current="{{ monster.hp_current }}" data-hp-max="{{ monster.hp_max }}">{{ monster.name }}</option>
              {% endfor %}
            </select>
          </label>
          <label>Entry Type {{ from_compendium_form.entry_type }}</label>
          <label>Name Override {{ from_compendium_form.name }}</label>
          <label>Initiative {{ from_compendium_form.initiative }}</label>
          <label class="tracker-inline-check">Active {{ from_compendium_form.is_active }}</label>
          <label>HP Current {{ from_compendium_form.hp_current }}</label>
          <label>HP Max {{ from_compendium_form.hp_max }}</label>
          <label>Items {{ from_compendium_form.items_text }}</label>
          <label class="tracker-form-span">Notes {{ from_compendium_form.notes }}</label>
          <label class="tracker-form-span">
            Condition
            <select name="status_effect_condition_id">
              <option value="">Choose condition (optional)</option>
              {% for condition in condition_options %}
                <option value="{{ condition.id }}">{{ condition.name }}</option>
              {% endfor %}
            </select>
          </label>
          <label>Status Effect Name <input type="text" name="status_effect_name" placeholder="Optional override"></label>
          <label>Status Rounds <input type="number" min="1" name="status_effect_rounds" value="1"></label>
        </div>
        <div class="tracker-modal-actions">
          <button class="button" type="submit">Add From Monster</button>
        </div>
      </form>
    </section>

    <section id="tracker-tab-player" class="tracker-tab-panel hidden">
      <form method="post" action="{% url 'tracker:add_from_player' %}" hx-post="{% url 'tracker:add_from_player' %}" hx-target="#tracker-list-region" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful){ closeTrackerModal('tracker-add-modal'); }" class="tracker-entry-form">
        {% csrf_token %}
        <div class="tracker-form-grid">
          <label>Game Player {{ from_player_form.source }}</label>
          <label>Name Override {{ from_player_form.name }}</label>
          <label>Initiative {{ from_player_form.initiative }}</label>
          <label class="tracker-inline-check">Active {{ from_player_form.is_active }}</label>
          <label class="tracker-form-span">Notes {{ from_player_form.notes }}</label>
          <label class="tracker-form-span">
            Condition
            <select name="status_effect_condition_id">
              <option value="">Choose condition (optional)</option>
              {% for condition in condition_options %}
                <option value="{{ condition.id }}">{{ condition.name }}</option>
              {% endfor %}
            </select>
          </label>
          <label>Status Effects <input type="text" name="status_effect_name" placeholder="Optional override"></label>
          <label>Status Rounds <input type="number" min="1" name="status_effect_rounds" value="1"></label>
        </div>
        <div class="tracker-modal-actions">
          <button class="button" type="submit">Add Player To Encounter</button>
        </div>
      </form>
    </section>
  </div>
</div>

<section class="panel">
  <h1>Compendium</h1>
  <form method="get" class="inline-form filters-form">
    <input type="search" name="q" value="{{ active_filters.q }}" placeholder="Search...">
    <select name="object_type">
      <option value="">All types</option>
      {% for value, label in object_type_choices %}
        <option value="{{ value }}" {% if active_filters.object_type == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <select name="tag">
      <option value="">All tags</option>
      {% for tag in tags %}
        <option value="{{ tag.id }}" {% if active_filters.tag == tag.id|stringformat:'s' %}selected{% endif %}>{{ tag.name }}</option>
      {% endfor %}
    </select>
    <label>
      <input type="checkbox" name="favorites" value="1" {% if active_filters.favorites == '1' %}checked{% endif %}>
      Favorites only
    </label>
    <select name="sort">
      <option value="">Default sort</option>
      <option value="favorites" {% if active_filters.sort == 'favorites' %}selected{% endif %}>Favorites first</option>
    </select>
    <button class="button" type="submit">Apply</button>
  </form>
</section>

<section class="panel">
  <p class="muted">Showing {{ objects|length }} of {{ page_obj.paginator.count }} objects on this page load.</p>
  {% if objects %}
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Fav</th>
            <th>Name</th>
            <th>Type</th>
            <th>System</th>
            <th>Source</th>
            <th>Tags</th>
          </tr>
        </thead>
        <tbody id="compendium-table-body">
          {% include "compendium/partials/object_rows.html" %}
        </tbody>
      </table>
    </div>
  {% else %}
    <p>No objects found.</p>
  {% endif %}
</section>

services:
  web:
    ports:
      - "${WEB_PORT_BIND:-127.0.0.1:8000:8000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      DEBUG: "false"
      DJANGO_SETTINGS_MODULE: dragon_den.settings.base
      REQUIRE_STRONG_SECRET_KEY: ${REQUIRE_STRONG_SECRET_KEY:-1}
      DJANGO_MIGRATE: ${DJANGO_MIGRATE:-1}
      DJANGO_COLLECTSTATIC: ${DJANGO_COLLECTSTATIC:-1}
      PERF_GUARD_ON_STARTUP: ${PERF_GUARD_ON_STARTUP:-1}
      PERF_GUARD_STARTUP_ITERATIONS: ${PERF_GUARD_STARTUP_ITERATIONS:-2}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-1}
      SECURE_CONTENT_TYPE_NOSNIFF: ${SECURE_CONTENT_TYPE_NOSNIFF:-1}
      SECURE_REFERRER_POLICY: ${SECURE_REFERRER_POLICY:-same-origin}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-0}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-0}
    restart: always

  caddy:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles: []
    restart: always
